name: Collect and validate OMIE prices
on:
  workflow_dispatch:
  schedule:
    - cron: '17 13,17,21 * * *'
permissions:
  contents: write
concurrency:
  group: omie-price-publisher
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name == 'workflow_dispatch' || vars.OMIE_COLLECTION_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Download, validate and publish through tomorrow in Madrid
        run: python omie_pipeline.py collect
      - name: Commit validated archive and outputs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data processed
          if git diff --cached --quiet; then
            echo "Archive unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Update validated OMIE price archive"
          git push origin HEAD:main
